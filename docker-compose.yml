services:
  uber-wled:
    build: .
    container_name: uber-wled
    restart: unless-stopped
    # Colima/Docker bridge often cannot mDNS (or reliably reach) LAN WLED
    # devices. Host networking uses the Colima VM stack, which can reach the
    # LAN. Published ports are ignored with network_mode:host — app binds
    # PORT directly (8081). On Colima this is reachable at localhost:8081.
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8081
      - DB_PATH=/app/data/uber-wled.db
      # Unicast discovery CIDR used when mDNS multicast does not reach this
      # host (typical of Colima). Unset: private /24s on the VM's interfaces.
      # Set this to the LAN that holds the controllers. Example range only:
      # - DISCOVERY_CIDR=192.0.2.0/24
      # Schedules, calendar "today", and sunrise/sunset use the process-local
      # clock. The image defaults to UTC, which would shift those off the
      # house clock — home timezone is America/Chicago.
      - TZ=America/Chicago
